name: Jira context check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        if: ${{ !env.ACT }}
        with:
          python-version: '3.12'

      - name: Prepare Python environment
        run: |
          python3 -m venv /tmp/jira-check-venv
          /tmp/jira-check-venv/bin/python -m pip install \
          --quiet --disable-pip-version-check requests

  

      - name: Check Jira observation
        run: /tmp/jira-check-venv/bin/python bin/jira_context.py KAN-20


      - name: Check runtime and Jira observation
        run: bash bin/check_jira_context.sh KAN-20
