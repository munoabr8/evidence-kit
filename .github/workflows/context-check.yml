name: Context check

on: [push, pull_request, workflow_dispatch]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        if: ${{ !env.ACT }}
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - run: python3 bin/probe_context.py